# AKENO direct entry, Phase 4.1 (EXPERIMENTAL): the lines for /data/OnionHEN/config.ini with the host
# OnionHEN-AKENO-direct-fixed.elf. The sections already exist in that file; set the marked keys there.
# The original onionHEN v0.9.0 ignores the new keys (rollback needs no edit).
# Follow TEST-DE.md: tests H1-H4 run WITHOUT these keys (toolbox_target=toolbox), H5 with link mode,
# only H6-H8 with root mode.

[game_menu]
show_onionhen_options=true
# Options-menu entry: not part of this test round, keep it off
plugin_entry=none

[shortcuts]
cheats_menu=off
# hold L2 + R3 for one second
toolbox=l2_r3
# the plugin the shortcut is for (toolbox = as upstream)
toolbox_target=AKEN00001
# link = the Toolbox opens with AKENO NETWORK first and selected; X opens AKENO (default, H5)
# root = AKENO opens directly as the Settings root (EXPERIMENTAL, only from H6 on)
toolbox_target_mode=link
