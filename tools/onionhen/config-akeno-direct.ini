# AKENO direct entry (Phase 4, EXPERIMENTAL): the lines to add to /data/OnionHEN/config.ini for the
# host OnionHEN-AKENO-direct.elf. The sections already exist in that file; add the marked keys there.
# The original onionHEN v0.9.0 ignores the two new keys (rollback needs no edit).

[game_menu]
show_onionhen_options=true
# NEW: "AKENO NETWORK" in a game's options menu (none = off)
plugin_entry=AKEN00001

[shortcuts]
cheats_menu=off
# hold L2 + R3 for one second (or share / long_share)
toolbox=l2_r3
# NEW: the shortcut opens AKENO NETWORK instead of the Toolbox (toolbox = as upstream)
toolbox_target=AKEN00001
