name: PS5 ShellUI social pages (experimental)

# The AKENO pages in the PS5 ShellUI for the ORIGINAL onionHEN v0.9.0 host (docs/SHELLUI_HOST_DIAGNOSIS.md):
# the onionHEN double-injection check, the companion's host tests, the PS5 plugin ELF (built twice,
# byte-identical, descriptor and imports gated), the native-IPC daemon, and the experimental package
# with German guides, BUILDINFO and SHA-256 sums. onionHEN itself is not rebuilt or repackaged: the
# supported host is the unmodified upstream release. Nothing is sent to a console, and a successful
# build is not evidence that anything works on firmware 12.20.

on:
  push:
    paths:
      - ".github/workflows/ps5-shellui.yml"
      - "clients/ps5-ingame/**"
      - "clients/ps5-native/src/**"
      - "clients/ps5/**"
      - "tools/onionhen/**"
      - "docs/shellui/**"
  pull_request:
    paths:
      - ".github/workflows/ps5-shellui.yml"
      - "clients/ps5-ingame/**"
      - "clients/ps5-native/src/**"
      - "clients/ps5/**"
      - "tools/onionhen/**"
      - "docs/shellui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-shellui-${{ github.ref }}
  cancel-in-progress: true

env:
  PS5_SDK_COMMIT: f5d40f02770e9b0001dd9e18056eca70b3da8b40 # same SDK as ps5.yml and ps5-native.yml
  ONIONHEN_COMMIT: aaa4264588e00da33faccc7642d27c3c4cc339b1 # the supported host: onionHEN v0.9.0, unmodified
  PACKAGE: AKENO-NETWORK-PS5-SHELLUI

jobs:
  host:
    name: onionHEN double-injection check and the companion's host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git

      - name: Second Toolbox injection replayed with onionHEN v0.9.0's relocator (the "+6" failure)
        run: tools/onionhen/check-double-detour.sh

      - name: Companion host tests (ASan/UBSan; onionHEN v0.9.0 page rules; fake daemon)
        run: |
          clients/ps5-ingame/scripts/fetch-deps.sh
          cmake -S clients/ps5-ingame -B clients/ps5-ingame/build -DAKN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build clients/ps5-ingame/build -j"$(nproc)"
          ctest --test-dir clients/ps5-ingame/build --output-on-failure

  ps5:
    name: Build the PS5 ShellUI package (AKEN00001.elf, native-IPC daemon)
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install SDK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make cmake wget file binutils gcc python3

      - name: Fetch and install the pinned SDK
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ps5-payload-dev/sdk.git "$RUNNER_TEMP/ps5-sdk-src"
          git -C "$RUNNER_TEMP/ps5-sdk-src" checkout --detach "$PS5_SDK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ps5-sdk-src" rev-parse HEAD)" = "$PS5_SDK_COMMIT"
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          make -C "$RUNNER_TEMP/ps5-sdk-src" DESTDIR="$RUNNER_TEMP/ps5-payload-sdk" install

      - name: Fetch pinned third-party inputs (checksums verified)
        run: clients/ps5-ingame/scripts/fetch-deps.sh

      - name: Build the plugin twice and require identical output; descriptor and import gates
        shell: bash
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          make -C clients/ps5-ingame/console -j"$(nproc)" BUILD="$RUNNER_TEMP/ingame-repro"
          make -C clients/ps5-ingame/console -j"$(nproc)"
          cmp "$RUNNER_TEMP/ingame-repro/AKEN00001.elf" clients/ps5-ingame/build-ps5/AKEN00001.elf
          clients/ps5-ingame/console/check-plugin.sh clients/ps5-ingame/build-ps5 | tee "$RUNNER_TEMP/gate-plugin.txt"

      - name: Build the native-IPC daemon (source unchanged; the companion needs native interface 2 or later)
        shell: bash
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          make -C clients/ps5/console -j"$(nproc)" NATIVE_IPC=1
          clients/ps5/console/check-imports.sh clients/ps5/build-ps5-native-ipc | tee "$RUNNER_TEMP/gate-daemon.txt"

      - name: Package (no onionHEN binary; no hardware release)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$PACKAGE"
          mkdir -p "$out/plugin" "$out/daemon" "$out/docs" "$out/licenses"
          cp clients/ps5-ingame/build-ps5/AKEN00001.elf "$out/plugin/"
          cp clients/ps5/build-ps5-native-ipc/akeno-network-ps5-native-ipc.elf "$out/daemon/"
          cp docs/shellui/INSTALL-DE.md docs/shellui/TEST-PLAN-DE.md docs/shellui/ROLLBACK-DE.md docs/shellui/DIAGNOSE-DE.md "$out/docs/"
          cp docs/SHELLUI_HOST_DIAGNOSIS.md docs/SHELLUI_CONTROL_CENTER_RESEARCH.md docs/IN_GAME_ACCESS.md "$out/docs/"
          # one flat docs folder in the package: links between these files lose their repo paths
          sed -i -e 's#](\.\./\(SHELLUI_[A-Z_]*\.md\)#](\1#g' -e 's#](\.\./IN_GAME_ACCESS\.md#](IN_GAME_ACCESS.md#g' -e 's#](shellui/#](#g' "$out"/docs/*.md
          ! grep -q '](\.\./SHELLUI_\|](shellui/' "$out"/docs/*.md
          cp clients/ps5-ingame/third_party/onion-sdk/LICENSE "$out/licenses/GPL-3.0.txt"
          cp LICENSE "$out/licenses/AKENO-MIT.txt"
          tar xjf clients/ps5/third_party/mbedtls-3.6.7.tar.bz2 -O mbedtls-3.6.7/LICENSE > "$out/licenses/mbedTLS-Apache-2.0.txt"
          grep -q 'Version 3, 29 June 2007' "$out/licenses/GPL-3.0.txt"
          grep -q 'Apache License' "$out/licenses/mbedTLS-Apache-2.0.txt"
          for elf in "$out/plugin/AKEN00001.elf" "$out/daemon/akeno-network-ps5-native-ipc.elf"; do
            readelf -h "$elf" | grep -q 'ELF64'
          done
          plugin_sha="$(sha256sum "$out/plugin/AKEN00001.elf" | cut -d' ' -f1)"
          daemon_sha="$(sha256sum "$out/daemon/akeno-network-ps5-native-ipc.elf" | cut -d' ' -f1)"
          {
            echo "AKENO NETWORK - PS5 ShellUI social pages (EXPERIMENTAL, not hardware tested)"
            echo "Built:           $(date -u +%Y-%m-%dT%H:%M:%SZ) by $GITHUB_WORKFLOW run $GITHUB_RUN_ID"
            echo "AKENO commit:    $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "Source:          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
            echo "PS5 SDK:         ps5-payload-dev/sdk $PS5_SDK_COMMIT"
            echo "Plugin SDK:      OnionBuddies/onionHEN-plugin-sdk $(git -C clients/ps5-ingame/third_party/onion-sdk rev-parse HEAD) (GPLv3 runtime)"
            echo
            echo "plugin/AKEN00001.elf   onionHEN plugin AKEN00001 1.10 (capabilities NOTIFY|IPC|UI, flags LONG_RUNNING|STOP_SUPPORTED)"
            echo "                       sha256 $plugin_sha"
            echo "daemon/akeno-network-ps5-native-ipc.elf   native interface 3, build $(git rev-parse --short=12 HEAD)-ps5-native-ipc"
            echo "                       sha256 $daemon_sha"
            echo "                       source unchanged since the hardware-tested 196ca13c71d1 build: keep yours if it works"
            echo
            echo "Required host: the ORIGINAL onionHEN v0.9.0 (aydencharles/onionHEN tag v0.9.0, commit $ONIONHEN_COMMIT),"
            echo "unmodified, from its own release. It is NOT included. The custom host of PR #14 is not used."
            echo
            echo "Hardware status: not run on a PS5. See docs/TEST-PLAN-DE.md."
          } > "$out/BUILDINFO.txt"
          cp "$RUNNER_TEMP/gate-plugin.txt" "$out/docs/GATE-plugin.txt"
          cp "$RUNNER_TEMP/gate-daemon.txt" "$out/docs/GATE-daemon.txt"
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS > /dev/null)
          cat "$out/BUILDINFO.txt"
          cat "$out/SHA256SUMS"

      - name: Upload the experimental package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ env.PACKAGE }}/
          if-no-files-found: error
          retention-days: 30
