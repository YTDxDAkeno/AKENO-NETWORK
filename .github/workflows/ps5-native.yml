name: PS5 native client

# AKENO NETWORK Native (clients/ps5-native, docs/PS5_NATIVE_ADR.md): host tests and the PS5 ELF.
# Separate from ps5.yml, which keeps rebuilding and verifying the hardware-tested daemon ELFs
# byte for byte. Nothing is sent to a console: hardware tests are started by a person, by hand,
# with an approved build. A desktop build is never evidence that anything works on a PS5.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-native-${{ github.ref }}
  cancel-in-progress: true

env:
  PS5_SDK_COMMIT: f5d40f02770e9b0001dd9e18056eca70b3da8b40 # same SDK as the daemon (ps5.yml)
  RELEASE_NAME: akeno-native-ps5-0.1.0-prototype

jobs:
  host:
    name: Host build, unit tests, UI integration tests, static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # package.json names pnpm; this job needs no packages (the UI test uses Node built-ins only).
          package-manager-cache: false

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libsdl2-dev valgrind clang-18 clang-tidy-18

      - name: Fetch pinned third-party inputs (checksums verified)
        run: clients/ps5-native/scripts/fetch-deps.sh

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer (GCC, -Werror)
        run: |
          cmake -S clients/ps5-native -B clients/ps5-native/build-asan -DAKN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build clients/ps5-native/build-asan -j"$(nproc)"

      - name: Unit tests (sanitizers)
        run: ctest --test-dir clients/ps5-native/build-asan --output-on-failure

      - name: Native UI integration tests (headless SDL, virtual controller, fake server and daemon)
        run: AKN_IT_OUT="$RUNNER_TEMP/ui-screenshots" node clients/ps5-native/tests/integration/run.mjs clients/ps5-native/build-asan/akeno-native

      - name: Release build with Clang (-Werror) and unit tests under Valgrind
        run: |
          cmake -S clients/ps5-native -B clients/ps5-native/build-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build clients/ps5-native/build-clang -j"$(nproc)"
          valgrind --leak-check=full --error-exitcode=99 -q clients/ps5-native/build-clang/akn_unit_tests

      - name: Static analysis (Clang analyzer and bugprone checks)
        working-directory: clients/ps5-native
        run: |
          # valist.Uninitialized is a known false positive with _FORTIFY_SOURCE's __vsnprintf_chk.
          checks='-*,clang-analyzer-*,bugprone-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions,-bugprone-implicit-widening-of-multiplication-result,-bugprone-reserved-identifier,-bugprone-assignment-in-if-condition,-bugprone-branch-clone,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,-bugprone-multi-level-implicit-pointer-conversion,-clang-analyzer-valist.Uninitialized'
          clang-tidy-18 -p build-clang --quiet --warnings-as-errors='*' --checks="$checks" \
            src/core/*.c src/app/app.c src/app/screens.c src/app/gfx.c src/app/net.c src/app/report.c src/app/main.c \
            src/platform/platform_host.c tools/make_icon.c

      - name: Upload the UI screenshots and report of the integration test (PC, not PS5 evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akeno-native-pc-ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          retention-days: 30
          if-no-files-found: ignore

  ps5:
    name: Build the PS5 ELF with the pinned SDK and SDL2
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install SDK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make cmake wget file binutils gcc

      - name: Fetch and install the pinned SDK
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ps5-payload-dev/sdk.git "$RUNNER_TEMP/ps5-sdk-src"
          git -C "$RUNNER_TEMP/ps5-sdk-src" checkout --detach "$PS5_SDK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ps5-sdk-src" rev-parse HEAD)" = "$PS5_SDK_COMMIT"
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          make -C "$RUNNER_TEMP/ps5-sdk-src" DESTDIR="$RUNNER_TEMP/ps5-payload-sdk" install

      - name: Fetch pinned third-party inputs (checksums verified)
        run: clients/ps5-native/scripts/fetch-deps.sh

      - name: Build SDL2 for the PS5 (ps5-payload-dev/SDL ee4c47d, software renderer)
        run: PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk" clients/ps5-native/scripts/build-sdl-ps5.sh

      - name: Build the native ELF twice and require identical output (reproducible)
        shell: bash
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          commit="$(git rev-parse --short=12 HEAD)"
          make -C clients/ps5-native/console -j"$(nproc)" BUILD="$RUNNER_TEMP/repro" GIT_COMMIT="$commit"
          make -C clients/ps5-native/console -j"$(nproc)" GIT_COMMIT="$commit"
          cmp "$RUNNER_TEMP/repro/akeno-native.elf" clients/ps5-native/build-ps5/akeno-native.elf
          echo "Reproducible: $(sha256sum clients/ps5-native/build-ps5/akeno-native.elf)"

      - name: Safety gate (reviewed imports, forbidden functions)
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          clients/ps5-native/console/check-native.sh clients/ps5-native/build-ps5 | tee gate.txt

      - name: Launcher icon (generated from AKENO's mark on the PC) and the launcher folder
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Iclients/ps5-native/src/core -o "$RUNNER_TEMP/make-icon" \
            clients/ps5-native/tools/make_icon.c clients/ps5-native/src/core/logo.c clients/ps5-native/src/core/png.c -lm
          "$RUNNER_TEMP/make-icon" "$RUNNER_TEMP/icon0.png" 512
          PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk" make -C clients/ps5-native/console package ICON="$RUNNER_TEMP/icon0.png"

      - name: Inspect, checksum and describe the build
        shell: bash
        run: |
          out="dist/$RELEASE_NAME"
          mkdir -p "$out/debug"
          cp -r clients/ps5-native/build-ps5/AKENONative "$out/"
          cp clients/ps5-native/build-ps5/akeno-native.elf "$out/"
          cp clients/ps5-native/build-ps5/akeno-native.debug.elf "$out/debug/"
          for elf in "$out"/akeno-native.elf "$out"/AKENONative/eboot.elf "$out"/debug/akeno-native.debug.elf; do
            readelf -h "$elf" | grep -q 'ELF64'
            readelf -h "$elf" | grep -q 'Advanced Micro Devices X86-64'
            readelf -h "$elf" | grep -q 'DYN (Position-Independent Executable file)'
          done
          cmp "$out/akeno-native.elf" "$out/AKENONative/eboot.elf"
          cp docs/PS5_NATIVE_CLIENT.md "$out/README.md"
          cp docs/HARDWARE_TEST_PLAN_PS5_NATIVE_0.1.md "$out/HARDWARE_TEST_PLAN.md"
          cp docs/PS5_NATIVE_ADR.md "$out/ARCHITECTURE_DECISION.md"
          cp docs/LICENSES.md "$out/LICENSES.md"
          cp clients/ps5-native/third_party/inter/OFL.txt "$out/LICENSE-Inter-OFL.txt"
          (cd "$out" && sha256sum akeno-native.elf AKENONative/eboot.elf AKENONative/homebrew.js AKENONative/sce_sys/icon0.png > SHA256SUMS)
          (cd "$out/debug" && sha256sum akeno-native.debug.elf > SHA256SUMS)
          nm="$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-nm"
          {
            echo "AKENO NETWORK Native 0.1.0-prototype (PS5, first hardware-testable build)"
            echo "Source commit:   $(git rev-parse HEAD)"
            echo "Workflow run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ps5-payload-sdk: $PS5_SDK_COMMIT"
            echo "SDL2:            ps5-payload-dev/SDL $(cat clients/ps5-native/third_party/sdl-ps5/.akeno-sdl-commit) (libSDL2.a $(sha256sum clients/ps5-native/third_party/sdl-ps5/lib/libSDL2.a | cut -d' ' -f1))"
            echo "mbedTLS:         3.6.7 ($(sha256sum clients/ps5/third_party/mbedtls-3.6.7.tar.bz2 | cut -d' ' -f1))"
            echo "CA bundle:       certifi 2026.07.22 ($(sha256sum clients/ps5/third_party/cacert.pem | cut -d' ' -f1))"
            echo "stb_truetype:    v1.26, nothings/stb 6e9f34d ($(sha256sum clients/ps5-native/third_party/stb_truetype.h | cut -d' ' -f1))"
            echo "Inter:           4.1 Regular + Bold ($(sha256sum clients/ps5-native/third_party/inter/Inter-Regular.ttf | cut -c1-16)…, $(sha256sum clients/ps5-native/third_party/inter/Inter-Bold.ttf | cut -c1-16)…)"
            echo "Compiler:        $("$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-clang" --version | head -1)"
            echo "Reproducible:    built twice in this run, byte-identical"
            echo
            echo "SHA-256:"
            sed 's/^/  /' "$out/SHA256SUMS"
            echo "  (debug artifact) $(cat "$out/debug/SHA256SUMS")"
            echo
            echo "Shared libraries required:"
            readelf -d "$out/akeno-native.elf" | grep NEEDED | sed 's/^.*\[/  /; s/\]$//'
            echo
            cat gate.txt
            echo
            echo "System imports:"
            "$nm" -D --undefined-only "$out/akeno-native.elf" | awk '{print $2}' | grep -E '^(sce|kernel_)' | sort | sed 's/^/  /'
            echo
            echo "Hardware status: NOT run on a PS5 yet. Nothing in this build is verified on hardware."
            echo "  Start it only from a homebrew launcher (AKENONative/ folder), following HARDWARE_TEST_PLAN.md."
            echo "  Sent to an ELF loader instead, it detects the background context, opens nothing and stops."
          } > "$out/BUILDINFO.txt"
          cat "$out/BUILDINFO.txt"

      - name: Upload the release build (launcher folder, ELF, checksums, build info, test plan)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            dist/${{ env.RELEASE_NAME }}
            !dist/${{ env.RELEASE_NAME }}/debug
          retention-days: 90

      - name: Upload the debug ELF separately
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-debug
          path: dist/${{ env.RELEASE_NAME }}/debug
          retention-days: 90
