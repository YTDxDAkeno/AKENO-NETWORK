name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # LiveKit server of the compose voice profile, as a release binary for tests that start their own.
  LIVEKIT_VERSION: 1.12.0
  LIVEKIT_SHA256: 9b89eb169c6c5795393bad6b52a9d0c73640a5993b37162558b4e249e5fe3aee

jobs:
  checks:
    name: Lint, typecheck, unit/integration tests, E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akeno
          POSTGRES_PASSWORD: akeno_ci_password
          POSTGRES_DB: akeno_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akeno -d akeno_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The CI database user is a superuser and may create disposable test databases.
      TEST_DATABASE_ADMIN_URL: postgres://akeno:akeno_ci_password@127.0.0.1:5432/postgres
      E2E_DATABASE_ADMIN_URL: postgres://akeno:akeno_ci_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The voice gateway tests start this binary themselves (console <-> LiveKit participant both
      # ways, mute, deafen, replacement, removal, refused passes); without it they are skipped.
      - name: Fetch the pinned LiveKit server (checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/livekit"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/livekit/livekit.tgz" "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          echo "$LIVEKIT_SHA256  $RUNNER_TEMP/livekit/livekit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/livekit/livekit.tgz" -C "$RUNNER_TEMP/livekit" livekit-server
          echo "LIVEKIT_SERVER_BIN=$RUNNER_TEMP/livekit/livekit-server" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @akeno/web exec playwright install --with-deps chromium

      # A real LiveKit server for the party voice test (voice.spec.ts). Host networking so the
      # browser reaches its media port and LiveKit reaches the E2E server's webhook on 127.0.0.1.
      - name: Start LiveKit for the voice test
        run: |
          docker run -d --name livekit --network host \
            -e LIVEKIT_CONFIG="$(printf '%s\n' \
              'port: 7880' 'bind_addresses: ["127.0.0.1"]' \
              'rtc:' '  tcp_port: 7881' '  udp_port: 7882' '  use_external_ip: false' '  node_ip: 127.0.0.1' \
              'keys:' '  akeno-ci: akeno-ci-secret-that-is-long-enough-0123456789' \
              'room:' '  auto_create: false' \
              'webhook:' '  api_key: akeno-ci' '  urls:' '    - http://127.0.0.1:3200/api/v1/voice/webhook')" \
            livekit/livekit-server:v1.12.0
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7880 >/dev/null && exit 0; sleep 1; done
          docker logs livekit; exit 1

      - name: Browser end-to-end tests
        env:
          E2E_LIVEKIT_URL: ws://127.0.0.1:7880
          E2E_LIVEKIT_API_KEY: akeno-ci
          E2E_LIVEKIT_API_SECRET: akeno-ci-secret-that-is-long-enough-0123456789
        run: pnpm --filter @akeno/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  client:
    name: Device client and console app (C) - build, unit and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akeno
          POSTGRES_PASSWORD: akeno_ci_password
          POSTGRES_DB: akeno_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akeno -d akeno_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://akeno:akeno_ci_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install C toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libssl-dev valgrind

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build

      - name: Fetch pinned console TLS inputs (checksums verified)
        run: clients/ps5/scripts/fetch-deps.sh

      - name: Build client and console app with AddressSanitizer and UndefinedBehaviorSanitizer
        run: pnpm client:build

      - name: Client unit tests (OpenSSL and mbedTLS transports)
        run: |
          clients/ps5/build-asan/akeno_unit_tests
          clients/ps5/build-asan/akeno_unit_tests_mbedtls

      - name: Client end-to-end tests against a disposable server (OpenSSL transport)
        run: node clients/ps5/tests/integration/run.mjs clients/ps5/build-asan/akeno-cli

      - name: Install Playwright Chromium for the console page tests
        run: pnpm --filter @akeno/web exec playwright install --with-deps chromium

      - name: Client and console app end-to-end tests (mbedTLS console transport)
        env:
          AKENO_REQUIRE_BROWSER: '1'
          AKENO_UI_SCREENSHOTS: ${{ runner.temp }}/console-ui
        run: |
          mkdir -p "$AKENO_UI_SCREENSHOTS"
          node clients/ps5/tests/integration/run.mjs clients/ps5/build-asan/akeno-cli-mbedtls --app clients/ps5/build-asan/akeno-app \
            --audiolab clients/ps5/build-asan/akeno-app-audiolab

      - name: Upload console page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-ui-screenshots
          path: ${{ runner.temp }}/console-ui
          retention-days: 14
          if-no-files-found: ignore

      - name: Release build and Valgrind check
        run: |
          cmake -S clients/ps5 -B clients/ps5/build -DCMAKE_BUILD_TYPE=Release -DAKENO_REQUIRE_MBEDTLS=ON
          cmake --build clients/ps5/build -j
          valgrind --leak-check=full --error-exitcode=99 -q clients/ps5/build/akeno_unit_tests
          valgrind --leak-check=full --error-exitcode=99 -q clients/ps5/build/akeno_unit_tests_mbedtls

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build -f infrastructure/docker/Dockerfile -t akeno-network:ci .

      - name: Build voice gateway image
        run: docker build -f infrastructure/docker/voice-gateway.Dockerfile -t akeno-voice-gateway:ci .

      - name: Validate Compose configuration
        run: |
          POSTGRES_PASSWORD=ci-placeholder docker compose config --quiet
          POSTGRES_PASSWORD=ci-placeholder LIVEKIT_API_KEY=akenoci LIVEKIT_API_SECRET=ci0123456789abcdef0123456789abcdef \
            VOICE_GATEWAY_URL=wss://akeno.example.com/voice-gateway \
            docker compose --profile https --profile voice config --quiet

      - name: Validate the Caddyfile (app, /livekit and /voice-gateway routes)
        run: |
          docker run --rm -e AKENO_DOMAIN=akeno.example.com -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  voice-staging:
    name: Voice staging drill - production Compose stack, upgrade from the baseline, console voice both ways, rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Provisional production baseline: the last server state on GitHub before console voice
      # (Alpha 0.4 server, identical server code up to the native line). Replace it with the
      # commit the VPS really runs once that is verified (docs/SERVER_VOICE_UPGRADE.md).
      STAGING_BASELINE: ae948512475a6752fb4cebd70234893e037044e1
      # The PS5 voice-alpha of PR #18 (akeno-party-voice 0.1.0-alpha, native-IPC daemon, plugin
      # 1.20 check tool), built for Linux and driven against the staging stack.
      PS5_VOICE_ALPHA: ce06ba04c048a02cb4d2efeb707d6bc4ba2618fd
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev
          pnpm install --frozen-lockfile
          pnpm --filter @akeno/web exec playwright install --with-deps chromium

      - name: Build the baseline and candidate images
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" "$STAGING_BASELINE"
          docker build -f "$RUNNER_TEMP/baseline/infrastructure/docker/Dockerfile" -t akeno-network:baseline "$RUNNER_TEMP/baseline"
          docker build -f infrastructure/docker/Dockerfile -t akeno-network:candidate .
          docker build -f infrastructure/docker/voice-gateway.Dockerfile -t akeno-voice-gateway:candidate .

      - name: Build the PS5 voice-alpha host programs (PR #18; checksummed third-party inputs)
        run: |
          git fetch --no-tags origin "$PS5_VOICE_ALPHA"
          git worktree add --detach "$RUNNER_TEMP/ps5-voice-alpha" "$PS5_VOICE_ALPHA"
          cd "$RUNNER_TEMP/ps5-voice-alpha"
          clients/ps5-native/scripts/fetch-deps.sh
          clients/ps5-ingame/scripts/fetch-deps.sh
          cmake -S clients/ps5 -B clients/ps5/build -DAKENO_REQUIRE_MBEDTLS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build clients/ps5/build -j"$(nproc)" --target akeno-app-native-ipc
          cmake -S clients/ps5-ingame -B clients/ps5-ingame/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build clients/ps5-ingame/build -j"$(nproc)" --target akeno-ingame-check
          cmake -S clients/ps5-partyvoice -B clients/ps5-partyvoice/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build clients/ps5-partyvoice/build -j"$(nproc)" --target akeno-party-voice

      - name: Staging drill (fresh database; baseline 404, upgrade scripts, audio by frequency, revocation, rollback, restore)
        run: |
          echo "127.0.0.1 akeno-staging.local" | sudo tee -a /etc/hosts
          A="$RUNNER_TEMP/ps5-voice-alpha/clients"
          node infrastructure/staging/voice-staging.mjs --baseline "$STAGING_BASELINE" --candidate HEAD \
            --console-daemon "$A/ps5/build/akeno-app-native-ipc" --console-voice "$A/ps5-partyvoice/build/akeno-party-voice" \
            --console-companion "$A/ps5-ingame/build/akeno-ingame-check" --report "$RUNNER_TEMP/voice-staging-report.json"

      - name: Upload the staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-staging-report
          path: ${{ runner.temp }}/voice-staging-report.json
          retention-days: 30
          if-no-files-found: ignore
