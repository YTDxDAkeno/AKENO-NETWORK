name: PS5 console build

# Builds the AKENO NETWORK console app and the toolchain diagnostic for the PS5 with a pinned
# payload SDK. Produces ELF files with SHA-256 checksums and build information. Nothing is sent
# to a console: hardware tests are started by a person, by hand, with an approved build.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-${{ github.ref }}
  cancel-in-progress: true

env:
  PS5_SDK_COMMIT: f5d40f02770e9b0001dd9e18056eca70b3da8b40
  # Alpha 0.1, the build that ran on a PS5 with firmware 12.20 (user report). It is rebuilt from
  # its commit and must reproduce this SHA-256 exactly; it ships next to every new build as the
  # fallback.
  ALPHA_01_COMMIT: 592c23a7b64f11c1b43ca6d5cc8d9153106f256d
  ALPHA_01_SHA256: 35f393c64213410585b40262ce203423ec5c1ad66dda97e5919b9b31948b6b65

jobs:
  ps5:
    name: Build PS5 ELF files with the pinned SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the Alpha 0.1 fallback is rebuilt from its own commit

      - name: Install SDK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make wget file binutils

      - name: Fetch pinned SDK source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ps5-payload-dev/sdk.git "$RUNNER_TEMP/ps5-sdk-src"
          git -C "$RUNNER_TEMP/ps5-sdk-src" checkout --detach "$PS5_SDK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ps5-sdk-src" rev-parse HEAD)" = "$PS5_SDK_COMMIT"

      - name: Install SDK to a temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          make -C "$RUNNER_TEMP/ps5-sdk-src" DESTDIR="$RUNNER_TEMP/ps5-payload-sdk" install

      - name: Fetch pinned third-party inputs (checksums verified)
        run: clients/ps5/scripts/fetch-deps.sh

      - name: Build the console app
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          make -C clients/ps5/console -j"$(nproc)" GIT_COMMIT="$(git rev-parse --short=12 HEAD)"

      - name: Rebuild the hardware-tested Alpha 0.1 fallback and verify it is byte-identical
        shell: bash
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          git worktree add --detach "$RUNNER_TEMP/alpha-0.1" "$ALPHA_01_COMMIT"
          cp -r clients/ps5/third_party "$RUNNER_TEMP/alpha-0.1/clients/ps5/"
          make -C "$RUNNER_TEMP/alpha-0.1/clients/ps5/console" -j"$(nproc)" GIT_COMMIT="${ALPHA_01_COMMIT:0:12}"
          echo "$ALPHA_01_SHA256  $RUNNER_TEMP/alpha-0.1/clients/ps5/build-ps5/akeno-network-ps5.elf" | sha256sum -c -

      - name: Build the toolchain diagnostic
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          make -C clients/ps5/ps5-smoke

      - name: Check system imports (safety gate)
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          clients/ps5/console/check-imports.sh clients/ps5/build-ps5 | tee imports.txt

      # Experimental PS5 voice research (docs/PS5_AUDIO_RESEARCH.md): a separate ELF, never the
      # release one. It must pass the same gate and import exactly what the release ELF imports.
      - name: Build the experimental audio lab and check its imports
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          make -C clients/ps5/console -j"$(nproc)" EXPERIMENTAL_AUDIO=1 GIT_COMMIT="$(git rev-parse --short=12 HEAD)"
          clients/ps5/console/check-imports.sh clients/ps5/build-ps5-audiolab | tee imports-audiolab.txt
          nm="$PS5_PAYLOAD_SDK/bin/prospero-nm"
          diff <("$nm" -D --undefined-only clients/ps5/build-ps5/akeno-network-ps5.elf | awk '{print $2}' | sort) \
               <("$nm" -D --undefined-only clients/ps5/build-ps5-audiolab/akeno-network-ps5-audiolab.elf | awk '{print $2}' | sort)
          if "$nm" clients/ps5/build-ps5/akeno-network-ps5.debug.elf | grep -qE 'audio_lab|akeno_platform_audio'; then
            echo "The release ELF contains audio lab code" >&2; exit 1
          fi

      - name: Inspect, checksum and describe the build
        shell: bash
        run: |
          version="$(sed -n 's/^#define AKENO_APP_VERSION "\(.*\)"$/\1/p' clients/ps5/app/app_internal.h)"
          test -n "$version"
          out=dist/akeno-network-ps5-alpha-0.2-rc
          mkdir -p "$out/fallback-alpha-0.1"
          cp clients/ps5/build-ps5/akeno-network-ps5.elf "$out/"
          cp clients/ps5/build-ps5/akeno-network-ps5.debug.elf "$out/"
          cp clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf "$out/"
          cp "$RUNNER_TEMP/alpha-0.1/clients/ps5/build-ps5/akeno-network-ps5.elf" "$out/fallback-alpha-0.1/akeno-network-ps5-alpha-0.1.elf"
          cp docs/PS5_CLIENT.md "$out/README.md"
          cp docs/RELEASE_NOTES_ALPHA_0.2.md "$out/RELEASE_NOTES.md"
          cp docs/HARDWARE_TEST_PLAN_ALPHA_0.2.md "$out/HARDWARE_TEST_PLAN.md"
          mkdir -p "$out/experimental-audio-lab"
          cp clients/ps5/build-ps5-audiolab/akeno-network-ps5-audiolab.elf "$out/experimental-audio-lab/"
          cp docs/PS5_AUDIO_RESEARCH.md "$out/experimental-audio-lab/README.md"
          for elf in "$out"/*.elf "$out"/fallback-alpha-0.1/*.elf "$out"/experimental-audio-lab/*.elf; do
            readelf -h "$elf" | grep -q 'ELF64'
            readelf -h "$elf" | grep -q 'Advanced Micro Devices X86-64'
            readelf -h "$elf" | grep -q 'DYN (Position-Independent Executable file)'
          done
          (cd "$out" && sha256sum *.elf fallback-alpha-0.1/*.elf experimental-audio-lab/*.elf > SHA256SUMS)
          {
            echo "AKENO NETWORK console app $version (Alpha 0.2 release candidate)"
            echo "Source commit:   $(git rev-parse HEAD)"
            echo "Workflow run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ps5-payload-sdk: $PS5_SDK_COMMIT"
            echo "mbedTLS:         3.6.7 ($(sha256sum clients/ps5/third_party/mbedtls-3.6.7.tar.bz2 | cut -d' ' -f1))"
            echo "CA bundle:       certifi 2026.07.22 ($(sha256sum clients/ps5/third_party/cacert.pem | cut -d' ' -f1))"
            echo "Compiler:        $("$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-clang" --version | head -1)"
            echo
            echo "SHA-256:"
            sed 's/^/  /' "$out/SHA256SUMS"
            echo
            echo "Shared libraries required:"
            readelf -d "$out/akeno-network-ps5.elf" | grep NEEDED | sed 's/^.*\[/  /; s/\]$//'
            echo
            cat imports.txt
            echo
            echo "Hardware status:"
            echo "  akeno-network-ps5.elf ($version) has NOT been run on a PS5 yet. Test it only with the"
            echo "  checklist in HARDWARE_TEST_PLAN.md, after approving this exact SHA-256."
            echo "  fallback-alpha-0.1/akeno-network-ps5-alpha-0.1.elf is Alpha 0.1, rebuilt from"
            echo "  $ALPHA_01_COMMIT and verified byte-identical to the build that ran on a PS5"
            echo "  with firmware 12.20 (user report: browser, pairing, HTTPS/WSS, notifications)."
            echo "  experimental-audio-lab/akeno-network-ps5-audiolab.elf is an EXPERIMENTAL research build"
            echo "  (PS5 voice prototypes A and C). It has never run on a PS5. Use it only for the audio"
            echo "  test plan in its README, after approval; it is not a release and not needed for AKENO."
          } > "$out/BUILDINFO.txt"
          cat "$out/BUILDINFO.txt"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: akeno-network-ps5-alpha-0.2-rc
          path: dist/akeno-network-ps5-alpha-0.2-rc
          retention-days: 90
