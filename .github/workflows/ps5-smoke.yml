name: PS5 SDK diagnostic ELF

on:
  push:
    paths:
      - 'clients/ps5/ps5-smoke/**'
      - '.github/workflows/ps5-smoke.yml'
  pull_request:
    paths:
      - 'clients/ps5/ps5-smoke/**'
      - '.github/workflows/ps5-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps5-diagnostic:
    name: Compile diagnostic ELF with pinned PS5 SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install SDK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make wget file binutils
      - name: Fetch pinned SDK source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ps5-payload-dev/sdk.git "$RUNNER_TEMP/ps5-sdk-src"
          git -C "$RUNNER_TEMP/ps5-sdk-src" checkout --detach f5d40f02770e9b0001dd9e18056eca70b3da8b40
          test "$(git -C "$RUNNER_TEMP/ps5-sdk-src" rev-parse HEAD)" = f5d40f02770e9b0001dd9e18056eca70b3da8b40
      - name: Install SDK to temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/ps5-payload-sdk"
          make -C "$RUNNER_TEMP/ps5-sdk-src" DESTDIR="$RUNNER_TEMP/ps5-payload-sdk" install
      - name: Build AKENO diagnostic payload
        run: |
          export PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk"
          make -C clients/ps5/ps5-smoke
      - name: Inspect and checksum ELF
        shell: bash
        run: |
          file clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf
          readelf -h clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf
          readelf -h clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf | grep -q 'ELF64'
          readelf -h clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf | grep -q 'Advanced Micro Devices X86-64'
          cd clients/ps5/ps5-smoke
          sha256sum akeno-ps5-diagnostic.elf > akeno-ps5-diagnostic.elf.sha256
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: akeno-ps5-diagnostic
          path: |
            clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf
            clients/ps5/ps5-smoke/akeno-ps5-diagnostic.elf.sha256
          retention-days: 14
