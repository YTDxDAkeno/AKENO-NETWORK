# AKENO NETWORK production stack.
#
#   Local (HTTP on http://localhost:8080):  docker compose up -d --build
#   VPS with HTTPS through Caddy:          docker compose --profile https up -d --build
#   Party voice chat (LiveKit, optional):  add --profile voice (see docs/VOICE.md first:
#                                          it needs firewall openings for 7881/tcp and 7882/udp)
#
# Configuration comes from .env (copy .env.example). PostgreSQL is never published to the host.
name: akeno-network

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: akeno
      POSTGRES_USER: akeno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Modest settings for a 1-2 GB VPS.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akeno -d akeno']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: akeno-network:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://akeno:${POSTGRES_PASSWORD}@db:5432/akeno
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PUBLIC_ORIGIN: ${AKENO_PUBLIC_ORIGIN:-http://localhost:8080}
      ADDITIONAL_ORIGINS: ${ADDITIONAL_ORIGINS:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      # Caddy reaches the app over the private Docker network.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_IDLE_TIMEOUT_DAYS: ${SESSION_IDLE_TIMEOUT_DAYS:-7}
      # Uploaded images live on their own persistent volume (back it up with backup.sh).
      MEDIA_DIR: /data/media
      MEDIA_MAX_TOTAL_MB: ${MEDIA_MAX_TOTAL_MB:-2048}
      MEDIA_MIN_FREE_MB: ${MEDIA_MIN_FREE_MB:-512}
      # Party voice (all three of URL, key and secret, or none to keep voice off).
      # LIVEKIT_URL is what browsers use: wss://<domain>/livekit behind Caddy.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      VOICE_TOKEN_TTL_SECONDS: ${VOICE_TOKEN_TTL_SECONDS:-120}
      # SharePlay (Alpha 0.5, experimental; off unless enabled). docs/SHAREPLAY_ARCHITECTURE.md
      SHAREPLAY_ENABLED: ${SHAREPLAY_ENABLED:-false}
      SHAREPLAY_MAX_VIEWERS: ${SHAREPLAY_MAX_VIEWERS:-4}
      SHAREPLAY_MAX_QUALITY: ${SHAREPLAY_MAX_QUALITY:-720p60}
      SHAREPLAY_REMOTE_INPUT_ENABLED: ${SHAREPLAY_REMOTE_INPUT_ENABLED:-false}
      SHAREPLAY_GRANT_MAX_MINUTES: ${SHAREPLAY_GRANT_MAX_MINUTES:-120}
      # Console voice through the voice gateway (voice profile): wss://<domain>/voice-gateway.
      # Empty keeps consoles out of voice; browsers are not affected.
      VOICE_GATEWAY_URL: ${VOICE_GATEWAY_URL:-}
    ports:
      # Bound to localhost by default; Caddy (or an SSH tunnel) is the public entry point.
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3000'
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - media-data:/data/media
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles:
      - https
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Required for the https profile: the domain whose DNS points at this server.
      AKENO_DOMAIN: ${AKENO_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    networks:
      - frontend
    logging: *logging

  # Party voice: LiveKit SFU (Apache-2.0). Audio is relayed, never recorded (no egress service).
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    profiles:
      - voice
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: ${LIVEKIT_NODE_IP:-}
        keys:
          # Required for the voice profile (compose cannot require them only for one profile;
          # LiveKit refuses to start without keys).
          ${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}
        room:
          auto_create: false
          empty_timeout: 60
          departure_timeout: 20
          max_participants: 16
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://app:3000/api/v1/voice/webhook
        logging:
          level: ${LIVEKIT_LOG_LEVEL:-info}
    ports:
      # Signalling (WebSocket). Behind Caddy it is reached through /livekit; this localhost
      # binding is for local HTTP setups (LIVEKIT_URL=ws://localhost:7880).
      - '${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:7880:7880'
      # Media: must be reachable from the internet (see docs/VOICE.md, firewall section).
      - '7881:7881/tcp'
      - '7882:7882/udp'
    user: '65532:65532'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - frontend
    logging: *logging

  # Console voice: paired consoles join LiveKit rooms through this gateway (docs/PS5_VOICE.md).
  # It holds no data; audio passes through memory only and is never recorded.
  voice-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/voice-gateway.Dockerfile
    image: ${VOICE_GATEWAY_IMAGE:-akeno-voice-gateway:latest}
    profiles:
      - voice
    restart: unless-stopped
    depends_on:
      - livekit
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GATEWAY_MAX_SESSIONS: ${VOICE_GATEWAY_MAX_SESSIONS:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - frontend
    logging: *logging

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:

networks:
  # The database network has no route to the internet or the host.
  backend:
    internal: true
  frontend:
