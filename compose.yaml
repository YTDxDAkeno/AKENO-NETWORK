# AKENO NETWORK production stack.
#
#   Local (HTTP on http://localhost:8080):  docker compose up -d --build
#   VPS with HTTPS through Caddy:          docker compose --profile https up -d --build
#
# Configuration comes from .env (copy .env.example). PostgreSQL is never published to the host.
name: akeno-network

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: akeno
      POSTGRES_USER: akeno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Modest settings for a 1-2 GB VPS.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akeno -d akeno']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: akeno-network:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://akeno:${POSTGRES_PASSWORD}@db:5432/akeno
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PUBLIC_ORIGIN: ${AKENO_PUBLIC_ORIGIN:-http://localhost:8080}
      ADDITIONAL_ORIGINS: ${ADDITIONAL_ORIGINS:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      # Caddy reaches the app over the private Docker network.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_IDLE_TIMEOUT_DAYS: ${SESSION_IDLE_TIMEOUT_DAYS:-7}
    ports:
      # Bound to localhost by default; Caddy (or an SSH tunnel) is the public entry point.
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3000'
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles:
      - https
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Required for the https profile: the domain whose DNS points at this server.
      AKENO_DOMAIN: ${AKENO_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    networks:
      - frontend
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  # The database network has no route to the internet or the host.
  backend:
    internal: true
  frontend:
